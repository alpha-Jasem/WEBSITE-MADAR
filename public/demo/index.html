<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="عرض تجريبي لداشبورد مدار: موظف الاستقبال الذكي للعيادات والعقار والمتاجر.">
<link rel="icon" href="/favicon-logo.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مدار | عرض الداشبورد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark navy app shell (sidebar on the right, sticky top bar, content grid); bottom tab bar on phones.
   The logo's blue→violet gradient is reserved for the AI receptionist and primary actions. */
:root {
  color-scheme: dark;
  --abyss: #070C22; --panel: #0D1531; --panel-2: #121C3F; --raise: #17234D; --line: rgba(232,235,244,.09); --line-2: rgba(232,235,244,.16);
  --ink: #E8EBF4; --muted: #A3ABC4; --dim: #7C87A6;
  --sky: #48A8F0; --royal: #1131A8; --royal-2: #2A4BD1; --violet: #8053F8; --silver: #E8EBF4;
  --grad: linear-gradient(135deg, #48A8F0 0%, #2A4BD1 50%, #8053F8 100%);
  --ok: #34D399; --ok-bg: rgba(52,211,153,.13); --warn: #FBBF24; --warn-bg: rgba(251,191,36,.13); --bad: #F87171; --bad-bg: rgba(248,113,113,.13);
  --info: #7CC4FA; --info-bg: rgba(72,168,240,.14); --ai: #B49BFF; --ai-bg: rgba(128,83,248,.16);
  --f-display: "Alexandria", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --r-lg: 18px; --r-md: 13px; --r-sm: 9px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--abyss); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 18px; height: 18px; flex: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* shell */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--panel); border-inline-start: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 3px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 10px; padding: 2px 10px 18px; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.logo img { width: 32px; }
.nav-group { font-size: 11px; letter-spacing: .05em; color: var(--dim); padding: 14px 12px 4px; }
.nav { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 11px; color: var(--muted); font-weight: 500; border: 0; background: none; text-align: start; width: 100%; }
.nav:hover { background: rgba(255,255,255,.04); color: var(--ink); }
.nav.on { background: linear-gradient(270deg, rgba(72,168,240,.16), rgba(72,168,240,0)); color: var(--ink); box-shadow: inset -3px 0 0 var(--sky); }
.nav .badge { margin-inline-start: auto; }
.badge { font-style: normal; font-size: 11px; background: var(--bad); color: #FFFFFF; border-radius: 999px; padding: 0 7px; font-weight: 700; min-width: 20px; text-align: center; }
.side-foot { margin-top: auto; padding: 12px; border-radius: var(--r-md); background: var(--panel-2); border: 1px solid var(--line); font-size: 12.5px; }
.meter { height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--grad); border-radius: 99px; }
.meter.hot i { background: linear-gradient(90deg, var(--warn), var(--bad)); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(7,12,34,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 28px; display: flex; align-items: center; gap: 12px; }
.top .mlogo { display: none; }
.search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; color: var(--dim); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; padding: 9px 0; outline: none; color: var(--ink); }
.search kbd { font-size: 11px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 6px; color: var(--dim); }
.top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; position: relative; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; position: relative; color: var(--muted); }
.icon-btn:hover { color: var(--ink); }
.icon-btn .dot { position: absolute; top: 8px; inset-inline-end: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--panel); }
.avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; font-weight: 700; color: #FFFFFF; border: 0; }
.pop { position: absolute; top: 48px; inset-inline-end: 0; width: min(360px, calc(100vw - 32px)); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: 0 24px 50px -20px rgba(0,0,0,.7); padding: 8px; z-index: 40; }
.pop h4 { margin: 6px 10px 8px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }
.pop h4 button { background: none; border: 0; color: var(--sky); font-size: 12px; }
.pop-item { display: flex; gap: 10px; padding: 10px; border-radius: 12px; align-items: flex-start; background: none; border: 0; width: 100%; text-align: start; }
.pop-item:hover { background: rgba(255,255,255,.04); }
.pop-item p { margin: 0; font-size: 13px; font-weight: 600; }
.pop-item small { color: var(--dim); font-size: 12px; }
.pop-item.unread p::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sky); margin-inline-end: 6px; vertical-align: 1px; }
.content { padding: 24px 28px 110px; display: flex; flex-direction: column; gap: 18px; max-width: 1360px; width: 100%; }

/* type & bits */
.h1 { font-family: var(--f-display); font-size: 24px; font-weight: 700; margin: 0; text-wrap: balance; }
.h1-sub { margin: 2px 0 0; color: var(--muted); }
.head { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; min-width: 0; }
.card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h3 .aside { margin-inline-start: auto; color: var(--dim); font-weight: 500; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 13px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 11px; padding: 8px 14px; font-weight: 600; font-size: 13px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: rgba(232,235,244,.3); }
.btn.pri { background: var(--grad); border: 0; color: #FFFFFF; box-shadow: 0 8px 22px -10px rgba(128,83,248,.8); }
.btn.ghost { background: transparent; color: var(--sky); border-color: rgba(72,168,240,.35); }
.btn.danger { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.btn.sm { padding: 5px 11px; font-size: 12px; border-radius: 9px; }
.link { background: none; border: 0; color: var(--sky); font-weight: 600; padding: 0; }
.empty-line { color: var(--dim); text-align: center; padding: 18px 0; font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.input, .select, .textarea { background: var(--abyss); border: 1px solid var(--line-2); border-radius: 11px; padding: 9px 12px; color: var(--ink); width: 100%; }
.textarea { min-height: 96px; resize: vertical; line-height: 1.7; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--sky); outline: none; }
.toggle { position: relative; width: 42px; height: 24px; border-radius: 99px; background: rgba(255,255,255,.14); border: 0; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; transition: inset-inline-start .2s; }
.toggle[aria-checked="true"] { background: var(--royal-2); }
.toggle[aria-checked="true"]::after { inset-inline-start: 21px; }
.row-line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row-line:last-child { border-bottom: 0; }

/* home */
.alert { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--r-md); border: 1px solid; flex-wrap: wrap; }
.alert p { margin: 0; flex: 1; min-width: 200px; }
.alert.warn { background: var(--warn-bg); border-color: rgba(251,191,36,.3); color: #FDE68A; }
.alert.bad { background: var(--bad-bg); border-color: rgba(248,113,113,.3); color: #FECACA; }
.agent { position: relative; overflow: hidden; background: radial-gradient(120% 140% at 100% 0%, rgba(128,83,248,.28), transparent 55%), radial-gradient(90% 120% at 0% 100%, rgba(72,168,240,.2), transparent 60%), var(--panel-2); }
.agent-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.orb { width: 58px; height: 58px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; color: #FFFFFF; flex: none; box-shadow: 0 0 0 6px rgba(72,168,240,.1), 0 0 40px rgba(128,83,248,.45); animation: breathe 3.2s ease-in-out infinite; }
.orb.off { background: #3A4466; box-shadow: none; animation: none; }
@keyframes breathe { 50% { box-shadow: 0 0 0 10px rgba(72,168,240,.06), 0 0 56px rgba(128,83,248,.6); } }
.agent-top h4 { margin: 0; font-family: var(--f-display); font-size: 17px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.channels { display: flex; gap: 6px; flex-wrap: wrap; margin-inline-start: auto; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.stat { background: rgba(7,12,34,.55); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.3; }
.stat span { font-size: 12px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.kpi span { color: var(--muted); font-size: 12.5px; }
.kpi b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.35; }
.kpi i { font-style: normal; font-size: 11.5px; color: var(--ok); }
.kpi i.flat { color: var(--dim); }
.inbox { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.025); border: 1px solid var(--line); }
.item .dot { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.item p { margin: 0; font-weight: 600; font-size: 13.5px; }
.item small { color: var(--muted); font-size: 12px; }
.item .acts { margin-inline-start: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 160px; }
.bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; min-width: 0; height: 100%; }
.bar span { width: 100%; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--sky), var(--royal)); }
.bar.peak span { background: var(--grad); box-shadow: 0 0 18px rgba(128,83,248,.5); }
.bar small { font-size: 10.5px; color: var(--dim); white-space: nowrap; }
.bar b { font-size: 11px; }
.conv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 6px; border-bottom: 1px solid var(--line); background: none; border-inline: 0; border-top: 0; width: 100%; text-align: start; border-radius: 10px; }
.conv:hover { background: rgba(255,255,255,.03); }
.conv:last-child { border-bottom: 0; }
.conv .who { font-weight: 600; font-size: 13.5px; }
.conv .sum { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--info-bg); color: var(--sky); flex: none; }
.q { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.q:last-child { border-bottom: 0; }
.q p { margin: 0; flex: 1; min-width: 0; }
.q .times { color: var(--dim); font-size: 12px; white-space: nowrap; }
.usage { display: flex; flex-direction: column; gap: 14px; }
.usage-row { display: flex; justify-content: space-between; font-size: 13px; }
.usage-row span { color: var(--muted); }
.onboard { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
.step .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--raise); color: var(--muted); flex: none; }
.step.done .n { background: var(--ok-bg); color: var(--ok); }
.step p { margin: 0; font-weight: 600; }
.step small { color: var(--muted); }
.step .btn { margin-inline-start: auto; }

/* skeleton */
.sk { background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.09), rgba(255,255,255,.04)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 10px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* conversations */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.list { display: flex; flex-direction: column; }
.detail { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.thread { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.7; }
.msg small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
.msg.c { align-self: flex-start; background: var(--raise); border-start-start-radius: 4px; }
.msg.a { align-self: flex-end; background: rgba(42,75,209,.35); border: 1px solid rgba(72,168,240,.25); border-start-end-radius: 4px; }
.msg.s { align-self: flex-end; background: var(--ok-bg); border: 1px solid rgba(52,211,153,.3); border-start-end-radius: 4px; }
.msg .who { font-size: 11px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; }
.player { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--abyss); border: 1px solid var(--line); margin-bottom: 14px; }
.player .play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--grad); color: #FFFFFF; display: grid; place-items: center; flex: none; }
.wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 34px; min-width: 0; overflow: hidden; }
.wave i { flex: 1; min-width: 2px; border-radius: 2px; background: rgba(232,235,244,.22); }
.wave i.on { background: var(--sky); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.reply { display: flex; gap: 8px; margin-top: 12px; }
.reply input { flex: 1; min-width: 0; }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
th { text-align: start; color: var(--dim); font-weight: 600; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 12px 10px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: rgba(255,255,255,.025); }

/* bookings */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 10px 6px; text-align: center; }
.day.on { border-color: var(--sky); background: var(--info-bg); }
.day b { display: block; font-family: var(--f-display); font-size: 18px; }
.day small { color: var(--muted); font-size: 11.5px; }
.slot { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.slot:last-child { border-bottom: 0; }
.slot .time { font-family: var(--f-display); font-weight: 600; color: var(--muted); }

/* kb */
.acc { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.acc + .acc { margin-top: 10px; }
.acc summary { list-style: none; padding: 13px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; background: rgba(255,255,255,.02); }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .aside { margin-inline-start: auto; color: var(--dim); font-weight: 500; font-size: 12px; }
.qa { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.qa p { margin: 0; font-weight: 600; font-size: 13.5px; }
.qa div > span { color: var(--muted); font-size: 13px; }
.qa.new { background: var(--ai-bg); }

/* tickets */
.tk-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col-head { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 2px 4px 4px; }
.col-head .n { margin-inline-start: auto; color: var(--dim); font-weight: 600; font-size: 12px; }
.tk { text-align: start; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
.tk:hover { border-color: var(--line-2); }
.tk::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--pri, var(--dim)); }
.tk .id { font-size: 11.5px; color: var(--dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tk p { margin: 0; font-weight: 600; font-size: 13.5px; }
.tk .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.tk .who { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--raise); color: var(--ink); margin-inline-start: auto; }
.timeline { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.tl { display: flex; gap: 10px; font-size: 13px; }
.tl i { width: 8px; height: 8px; border-radius: 50%; background: var(--sky); margin-top: 7px; flex: none; }
.tl small { color: var(--dim); display: block; }

/* settings forms */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.hours { display: flex; flex-direction: column; }
.hour-row { display: grid; grid-template-columns: 90px auto 1fr 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.hour-row:last-child { border-bottom: 0; }
.hour-row .input { padding: 6px 10px; }

/* modal / toast / demo */
.scrim { position: fixed; inset: 0; background: rgba(3,6,18,.7); backdrop-filter: blur(3px); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 20px; padding: 22px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8); }
.modal h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: 18px; }
.modal .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(50%); background: var(--ink); color: var(--abyss); padding: 10px 18px; border-radius: 12px; font-weight: 600; z-index: 80; box-shadow: 0 14px 30px -10px rgba(0,0,0,.6); max-width: calc(100vw - 32px); }
.demo-btn { position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 22px; z-index: 50; border-radius: 999px; padding: 9px 15px; background: var(--raise); border: 1px solid var(--line-2); color: var(--muted); font-weight: 600; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 10px 24px -10px rgba(0,0,0,.7); }
.demo { position: fixed; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 22px; z-index: 55; width: min(320px, calc(100vw - 32px)); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); display: flex; flex-direction: column; gap: 12px; }
.demo h4 { margin: 0; font-size: 13.5px; }
.demo p { margin: 0; font-size: 12px; color: var(--dim); }
.demo .seg { width: 100%; }
.demo .seg button { flex: 1; padding: 6px 8px; font-size: 12px; }
.tabbar { display: none; }
.sheet .nav { padding: 12px; }

/* responsive */
@media (max-width: 1150px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .tk-sum { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .top { padding: 10px 16px; }
  .top .mlogo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; }
  .top .mlogo img { width: 28px; }
  .search { display: none; }
  .content { padding: 18px 16px calc(130px + env(safe-area-inset-bottom, 0px)); }
  .grid-2, .grid-3, .detail, .onboard, .form-grid, .board { grid-template-columns: 1fr; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; bottom: 0; inset-inline: 0; z-index: 45; background: rgba(13,21,49,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--dim); padding: 6px 0; position: relative; }
  .tabbar button.on { color: var(--ink); }
  .tabbar button.on .ico { color: var(--sky); }
  .tabbar .badge { position: absolute; top: 2px; inset-inline-end: 22%; font-size: 10px; }
  .demo-btn { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 16px; }
  .demo { bottom: calc(126px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 16px; }
  .hour-row { grid-template-columns: 70px auto 1fr 1fr; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .stat b { font-size: 21px; }
  .h1 { font-size: 20px; }
  .item { flex-wrap: wrap; }
  .item .acts { width: 100%; justify-content: flex-start; padding-inline-start: 48px; }
  .week { grid-template-columns: repeat(7, minmax(40px, 1fr)); overflow-x: auto; }
  .slot { grid-template-columns: 56px minmax(0, 1fr); }
  .slot > :last-child { grid-column: 2; justify-self: start; }
}
</style>

    : S.agent === 'low' ? `<div class="alert warn" role="status">${ic('alert')}<p><b>باقي 90 دقيقة من باقتك.</b> لما تخلص يوقف الرد على المكالمات، والواتساب يستمر.</p><button type="button" class="btn sm" data-go="settings">زوّد الباقة</button></div>` : '';
  const inbox = inboxItems();
  const peak = Math.max(...ind.perHour);
  return `${alertBox}
  <div class="head">
    <div><h1 class="h1">صباح الخير</h1><p class="h1-sub">${ind.biz} · الأحد 11 أكتوبر</p></div>
    <div class="seg" role="group" aria-label="الفترة">${[['today', 'اليوم'], ['week', 'الأسبوع'], ['month', 'الشهر']].map(([k, l]) => `<button type="button" aria-pressed="${S.period === k}" data-period="${k}">${l}</button>`).join('')}</div>
  </div>
  <div class="grid-2">
    <div class="card agent">
      <div class="agent-top">
        <div class="orb ${S.agent === 'live' || S.agent === 'low' ? '' : 'off'}">${ic('bot', 'style="width:26px;height:26px"')}</div>
        <div><h4>${ind.agentName} · موظف الاستقبال الذكي</h4><span class="status" style="color:${ag[1]}">${ag[0]}</span></div>
        <div class="channels">${Object.entries(CH).filter(([k]) => ind.voice || k !== 'phone').map(([k, [l, i]]) => chip(`${ic(i, 'style="width:13px;height:13px"')}${l}`, S.settings.channels[k] ? 'var(--ink)' : 'var(--dim)', S.settings.channels[k] ? 'rgba(255,255,255,.08)' : 'transparent')).join('')}</div>
      </div>
      <div class="stats3">
        ${ind.voice ? `<div class="stat"><b class="num">${p.calls.toLocaleString('en')}</b><span>مكالمة ${periodWord}</span></div>` : `<div class="stat"><b class="num">${p.resolved}%</b><span>انحلت بدون موظف</span></div>`}
        <div class="stat"><b class="num">${p.chats.toLocaleString('en')}</b><span>محادثة واتساب وموقع</span></div>
        <div class="stat"><b class="num">${p.booked.toLocaleString('en')}</b><span>${ind.bookedWord} ${ind.bookings ? 'سجّله' : 'تابعه'}</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button type="button" class="btn pri" data-act="test-call">${ic(ind.voice ? 'phone' : 'chat')} ${ind.voice ? 'جرّب مكالمة' : 'جرّب محادثة'}</button>
        ${S.agent === 'paused' ? `<button type="button" class="btn" data-act="agent-resume">${ic('play')} شغّله</button>` : `<button type="button" class="btn" data-act="agent-pause">${ic('pause')} إيقاف مؤقت</button>`}
      </div>
    </div>
    <div class="kpis">
      ${ind.voice ? `<div class="kpi"><span>انحلت بدون موظف</span><b class="num">${p.resolved}%</b><i>${p.d[0]}</i></div>` : `<div class="kpi"><span>محادثات ${periodWord}</span><b class="num">${p.chats.toLocaleString('en')}</b><i>${p.d[1]}</i></div>`}
      <div class="kpi"><span>خارج الدوام</span><b class="num">${p.after.toLocaleString('en')}</b><i class="flat">كانت بتضيع بدونه</i></div>
      <div class="kpi"><span>وقت وفّره ${periodWord}</span><b class="num">${p.saved} ساعة</b><i class="flat">من وقت فريق الاستقبال</i></div>
      <div class="kpi"><span>${ind.bookings ? `${ind.bookings} ${periodWord}` : `طلبات تابعها`}</span><b class="num">${p.booked.toLocaleString('en')}</b><i>${p.d[2]}</i></div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <h3>${ic('alert', 'style="color:var(--warn)"')} يحتاج تدخلك <span class="aside">${inbox.length ? `${inbox.length} أشياء · الأهم أولًا` : ''}</span></h3>
      ${inbox.length ? `<div class="inbox">${inbox.map(it => { const k = KIND[it.kind]; return `
        <div class="item">
          <div class="dot" style="background:${k[2]};color:${k[1]}">${ic(k[3])}</div>
          <div style="min-width:0;flex:1"><p>${esc(it.title)}</p><small>${esc(it.sub)}</small></div>
          <div class="acts">${it.kind === 'question' ? `<button type="button" class="btn sm pri" data-act="teach" data-q="${esc(it.q)}">علّمه الجواب</button>`
            : it.kind === 'human' ? `<button type="button" class="btn sm ghost" data-open="${it.conv.id}">افتح المحادثة</button>`
            : `<button type="button" class="btn sm ghost" data-act="call" data-id="${it.conv.id}">اتصل</button>`}
            ${it.conv ? `<button type="button" class="btn sm" data-act="dismiss" data-id="${it.conv.id}">تم</button>` : ''}</div>
        </div>`; }).join('')}</div>` : `<div class="empty-line">${ic('check', 'style="color:var(--ok);width:22px;height:22px;display:block;margin:0 auto 6px"')}كل شي تمام، ما فيه شي ينتظرك.</div>`}
    </div>
    <div class="card">
      <h3>${ic('chart', 'style="color:var(--sky)"')} ${ind.voice ? 'المكالمات' : 'المحادثات'} حسب الساعة <span class="aside">اليوم · الأزحم ${hourLabel(8 + ind.perHour.indexOf(peak))}</span></h3>
      <div class="bars" role="img" aria-label="توزيع اليوم بالساعة">${ind.perHour.map((v, i) => `<div class="bar ${v === peak ? 'peak' : ''}" title="${hourLabel(8 + i)}: ${v}">${v ? `<b class="num">${v}</b>` : ''}<span style="height:${v ? Math.max(6, Math.round(v / peak * 100) - 12) : 3}%"></span><small>${i % 2 === 0 ? hourLabel(8 + i) : '&nbsp;'}</small></div>`).join('')}</div>
    </div>
  </div>
  <div class="grid-3">
    <div class="card" style="grid-column: span 2">
      <h3>${ic('chat', 'style="color:var(--sky)"')} آخر المحادثات <span class="aside"><button type="button" class="link" data-go="convs">عرض الكل</button></span></h3>
      <div class="list">${allConvos().slice(0, 5).map(convRow).join('')}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <div class="card">
        <h3>${ic('spark', 'style="color:var(--ai)"')} علّم موظفك <span class="aside">${pendingQs().length} أسئلة</span></h3>
        ${pendingQs().length ? pendingQs().map(q => `<div class="q"><p>${esc(q.q)}</p><span class="times num">×${q.n}</span><button type="button" class="btn sm pri" data-act="teach" data-q="${esc(q.q)}">جاوب</button></div>`).join('') : '<div class="empty-line">جاوبت كل الأسئلة. الموظف صار يعرفها.</div>'}
      </div>
      <div class="card">
        <h3>${ic('ticket', 'style="color:var(--sky)"')} التذاكر <span class="aside"><button type="button" class="link" data-go="tickets">عرض الكل</button></span></h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">${['open', 'in_progress'].map(k => `<div class="stat" style="flex:1;min-width:96px"><b class="num">${TK().filter(t => t.status === k).length}</b><span>${TK_STATUS[k][0]}</span></div>`).join('')}<div class="stat" style="flex:1;min-width:96px"><b class="num" style="color:${TK().some(t => t.late && t.status !== 'resolved') ? 'var(--bad)' : 'var(--ink)'}">${TK().filter(t => t.late && t.status !== 'resolved').length}</b><span>متأخرة</span></div></div>
      </div>
      <div class="card">
        <h3>${ic('clock', 'style="color:var(--sky)"')} الباقة <span class="aside">تتجدد 1 نوفمبر</span></h3>
        <div class="usage">
          ${ind.voice ? `<div><div class="usage-row"><span>دقائق المكالمات</span><b class="num" dir="ltr">${S.agent === 'low' ? '2,410' : '1,840'} / 2,500</b></div><div class="meter ${S.agent === 'low' ? 'hot' : ''}"><i style="width:${S.agent === 'low' ? 96 : 74}%"></i></div></div>` : ''}
          <div><div class="usage-row"><span>محادثات الواتساب</span><b class="num" dir="ltr">${ind.period.month.chats.toLocaleString('en')} / 6,000</b></div><div class="meter"><i style="width:${Math.min(100, Math.round(ind.period.month.chats / 60))}%"></i></div></div>
        </div>
      </div>
    </div>
  </div>`;
}
function convRow(c) {
  const st = S.taken.has(c.id) ? chip('يتابعها موظف', 'var(--ok)', 'var(--ok-bg)') : outChip(c.out);
  return `<button type="button" class="conv" data-open="${c.id}"><span class="ch">${ic(CH[c.ch][1])}</span>
    <span style="min-width:0;display:block"><span class="who" style="display:block">${esc(c.name)}</span><span class="sum" style="display:block">${esc(c.sum)}</span></span>
    <span style="text-align:end;display:block">${st}<span style="display:block;color:var(--dim);font-size:11.5px;margin-top:4px">${c.t}</span></span></button>`;
}
function onboarding() {
  const ind = I();
  const steps = [
    [`اربط رقم الواتساب${ind.voice ? ' أو الهاتف' : ''}`, 'عشان يبدأ يرد على عملائك', 'ربط', 'settings', true],
    ['أضف أول 10 أسئلة وأجوبتها', 'الأسعار، الدوام، الموقع، وأكثر شي يسألون عنه', 'افتح قاعدة المعرفة', 'kb', false],
    [`جرّب ${ind.voice ? 'مكالمة' : 'محادثة'} بنفسك`, 'اسمع كيف يرد قبل ما يكلم عملاءك', 'جرّب الحين', 'test', false],
    ['شغّل الموظف الذكي', 'يبدأ يرد من الدقيقة الأولى', 'تشغيل', 'agent', false],
  ];
  return `<div class="head"><div><h1 class="h1">أهلًا بك في مدار</h1><p class="h1-sub">${ind.biz} · حسابك جاهز، باقي خطوات بسيطة</p></div></div>
  <div class="onboard">
    <div class="card"><h3>${ic('spark', 'style="color:var(--ai)"')} جهّز موظفك الذكي <span class="aside">1 من 4</span></h3>
      <div class="meter" style="margin:-4px 0 16px"><i style="width:25%"></i></div>
      <div class="steps">${steps.map(([t, s, b, go, done], i) => `<div class="step ${done ? 'done' : ''}"><span class="n">${done ? ic('check') : i + 1}</span><div style="min-width:0"><p>${t}</p><small>${s}</small></div>${done ? chip('تم', 'var(--ok)', 'var(--ok-bg)') : `<button type="button" class="btn sm ${i === 1 ? 'pri' : ''}" ${go === 'test' ? 'data-act="test-call"' : `data-go="${go}"`}>${b}</button>`}</div>`).join('')}</div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center">
      <div class="orb off" style="margin:0 auto;width:72px;height:72px">${ic('bot', 'style="width:32px;height:32px"')}</div>
      <h3 style="justify-content:center;margin:0">هنا بتشوف شغل موظفك</h3>
      <p style="margin:0;color:var(--muted)">أول ما يبدأ يرد، تظهر هنا المكالمات والمحادثات و${ind.bookings ? ind.bookings : 'الطلبات'} اللي سجّلها، والأشياء اللي تحتاج تدخلك.</p>
    </div>
  </div>`;
}

function convs() {
  const list = allConvos().filter(c => (S.filter === 'all' || c.ch === S.filter || (S.filter === 'needs' && c.needs && !S.taken.has(c.id))) && (!S.search || (c.name + c.sum + c.phone).includes(S.search)));
  return `<div class="head"><div><h1 class="h1">المحادثات</h1><p class="h1-sub">كل اللي رد عليه الموظف الذكي، ${I().voice ? 'مكالمات وواتساب وموقع' : 'واتساب وموقع'} في مكان واحد</p></div></div>
  <div class="filters">
    <div class="seg" role="group" aria-label="تصفية">${[['all', 'الكل'], ['needs', 'تحتاج تدخل'], ...(I().voice ? [['phone', 'مكالمات']] : []), ['whatsapp', 'واتساب'], ['web', 'الموقع']].map(([k, l]) => `<button type="button" aria-pressed="${S.filter === k}" data-filter="${k}">${l}</button>`).join('')}</div>
    <input class="input" id="conv-search" style="max-width:260px" placeholder="ابحث بالاسم أو الرقم" value="${esc(S.search)}">
  </div>
  <div class="card">${list.length ? `<div class="list">${list.map(convRow).join('')}</div>` : '<div class="empty-line">ما فيه محادثات تطابق البحث.</div>'}</div>`;
}

function convDetail() {
  const c = conv(S.convId); if (!c) return convs();
  const taken = S.taken.has(c.id);
  const staff = S.staffMsgs[c.id] || [];
  const wave = Array.from({ length: 64 }, (_, i) => `<i class="${S.playing && i < 22 ? 'on' : ''}" style="height:${18 + Math.round(Math.abs(Math.sin(i * 1.7) * 60 + Math.cos(i * .6) * 20))}%"></i>`).join('');
  return `<button type="button" class="link" data-go="convs" style="display:inline-flex;align-items:center;gap:4px;align-self:flex-start">${ic('back', 'style="width:16px;height:16px"')} المحادثات</button>
  <div class="head">
    <div><h1 class="h1">${esc(c.name)}</h1><p class="h1-sub"><span class="num" dir="ltr">${c.phone}</span> · ${CH[c.ch][0]} · ${c.t}${c.dur ? ` · المدة ${c.dur}` : ''}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${taken ? chip('يتابعها موظف', 'var(--ok)', 'var(--ok-bg)') : outChip(c.out)}</div>
  </div>
  <div class="detail">
    <div class="card">
      <h3>${ic(CH[c.ch][1], 'style="color:var(--sky)"')} ${c.ch === 'phone' ? 'تسجيل ونص المكالمة' : 'المحادثة'}</h3>
      ${c.ch === 'phone' ? `<div class="player"><button type="button" class="play" data-act="play" aria-label="${S.playing ? 'إيقاف' : 'تشغيل'} التسجيل">${ic(S.playing ? 'pause' : 'play')}</button><div class="wave" aria-hidden="true">${wave}</div><span class="num" style="color:var(--muted);font-size:12px">${S.playing ? '0:52' : '0:00'} / ${c.dur}</span></div>` : ''}
      <div class="thread">${c.lines.map(([w, t]) => `<div class="msg ${w}"><span class="who">${w === 'a' ? `${I().agentName} (الموظف الذكي)` : esc(c.name)}</span>${esc(t)}</div>`).join('')}
        ${staff.map(t => `<div class="msg s"><span class="who">أنت</span>${esc(t)}<small>الحين</small></div>`).join('')}</div>
      ${taken && c.ch !== 'phone' ? `<form class="reply" data-form="reply" data-id="${c.id}"><input class="input" id="reply-${c.id}" placeholder="اكتب ردك للعميل" autocomplete="off"><button class="btn pri" type="submit">${ic('send')} إرسال</button></form>` : ''}
    </div>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <div class="card"><h3>${ic('spark', 'style="color:var(--ai)"')} الملخص</h3><p style="margin:0 0 14px">${esc(c.sum)}</p>
        <dl class="kv">${Object.entries(c.fields).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
      <div class="card"><h3>الإجراءات</h3>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${taken ? `<button type="button" class="btn" data-act="release" data-id="${c.id}">${ic('bot')} رجّعها للموظف الذكي</button>` : `<button type="button" class="btn pri" data-act="take" data-id="${c.id}">${ic('user')} أنا أكمل المحادثة</button>`}
          <button type="button" class="btn" data-act="call" data-id="${c.id}">${ic('phone')} اتصل بالعميل</button>
          ${TK().some(t => t.conv === c.id) ? `<button type="button" class="btn" data-act="ticket" data-id="${TK().find(t => t.conv === c.id).id}">${ic('ticket')} التذكرة ${TK().find(t => t.conv === c.id).id}</button>` : `<button type="button" class="btn" data-act="new-ticket" data-conv="${c.id}">${ic('ticket')} افتح تذكرة</button>`}
          <button type="button" class="btn" data-act="teach" data-q="${esc(c.sum)}">${ic('book')} علّمه شي من هالمحادثة</button>
        </div></div>
    </div>
  </div>`;
}

function bookings() {
  const ind = I(); if (!ind.bookings) return home();
  const days = [['الأحد', 11], ['الاثنين', 12], ['الثلاثاء', 13], ['الأربعاء', 14], ['الخميس', 15], ['الجمعة', 16], ['السبت', 17]];
  const st = { confirmed: ['مؤكد', 'var(--ok)', 'var(--ok-bg)'], pending: ['بانتظار التأكيد', 'var(--warn)', 'var(--warn-bg)'] };
  return `<div class="head"><div><h1 class="h1">${ind.bookings}</h1><p class="h1-sub">${ind.slots.length} اليوم · ${ind.slots.filter(s => s[3] === 'pending').length} بانتظار تأكيد العميل</p></div><button type="button" class="btn pri" data-act="soon">${ic('plus')} ${ind.bookedWord} جديد</button></div>
  <div class="week">${days.map(([d, n], i) => `<div class="day ${i === 0 ? 'on' : ''}"><small>${d}</small><b class="num">${n}</b><small class="num">${i === 0 ? ind.slots.length : [5, 7, 4, 6, 0, 3][i - 1] ?? 0} ${ind.bookedWord}</small></div>`).join('')}</div>
  <div class="card"><h3>اليوم · الأحد 11 أكتوبر</h3>${ind.slots.map(([t, n, s, k]) => `<div class="slot"><span class="time num">${t}</span><div style="min-width:0"><b>${esc(n)}</b><div style="color:var(--muted);font-size:12.5px">${esc(s)} · سجّله الموظف الذكي</div></div>${chip(...st[k])}</div>`).join('')}</div>`;
}

function customers() {
  const rows = allConvos().map((c, i) => ({ ...c, visits: [4, 1, 2, 0, 3, 1][i % 6], last: c.t }));
  return `<div class="head"><div><h1 class="h1">العملاء</h1><p class="h1-sub">كل من تواصل مع الموظف الذكي يُحفظ هنا تلقائيًا</p></div></div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>العميل</th><th>الجوال</th><th>آخر تواصل</th><th>القناة</th><th>${I().bookings ? I().bookings : 'الطلبات'}</th><th>آخر نتيجة</th></tr></thead>
    <tbody>${rows.map(r => `<tr data-open="${r.id}"><td style="font-weight:600">${esc(r.name)}</td><td class="num" dir="ltr" style="text-align:end">${r.phone}</td><td style="color:var(--muted)">${r.last}</td><td>${CH[r.ch][0]}</td><td class="num">${r.visits}</td><td>${outChip(r.out)}</td></tr>`).join('')}</tbody>
  </table></div></div>`;
}

function kb() {
  const ind = I(); const pend = pendingQs(); const added = S.kbAdded.filter(a => a.ind === S.ind);
  return `<div class="head"><div><h1 class="h1">قاعدة المعرفة</h1><p class="h1-sub">اللي يعرفه ${ind.agentName} عن ${ind.biz}. أي تعديل هنا يستخدمه من المحادثة الجاية</p></div><button type="button" class="btn pri" data-act="teach" data-q="">${ic('plus')} سؤال جديد</button></div>
  ${pend.length ? `<div class="card" style="border-color:rgba(128,83,248,.4)"><h3>${ic('spark', 'style="color:var(--ai)"')} أسئلة سألها عملاؤك وما عرف يجاوبها <span class="aside">جاوبها مرة وتنضاف هنا</span></h3>
    ${pend.map(q => `<div class="q"><p>${esc(q.q)}</p><span class="times num">تكرر ×${q.n}</span><button type="button" class="btn sm pri" data-act="teach" data-q="${esc(q.q)}">جاوب</button></div>`).join('')}</div>` : ''}
  <div>${[...(added.length ? [{ cat: 'أضفتها مؤخرًا', items: added.map(a => [a.q, a.a]), fresh: true }] : []), ...ind.kb].map((g, gi) => `
    <details class="acc" ${gi === 0 ? 'open' : ''}><summary>${ic('book', 'style="color:var(--sky)"')}${g.cat}<span class="aside num">${g.items.length} أسئلة</span></summary>
      ${g.items.map(([q, a]) => `<div class="qa ${g.fresh ? 'new' : ''}"><div style="flex:1;min-width:0"><p>${esc(q)}</p><span>${esc(a)}</span></div><button type="button" class="btn sm" data-act="teach" data-q="${esc(q)}" data-a="${esc(a)}">تعديل</button></div>`).join('')}
    </details>`).join('')}</div>`;
}

function agentPage() {

function reports() {

    <div class="kpi"><span>${ind.bookings || 'طلبات تابعها'}</span><b class="num">${p.booked.toLocaleString('en')}</b></div>
    <div class="kpi"><span>وقت موفّر</span><b class="num">${p.saved} س</b></div>
  </div>
  <div class="grid-2">
    <div class="card"><h3>${ind.voice ? 'المكالمات' : 'المحادثات'} عبر الوقت</h3>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="رسم الأداء">
        <defs><linearGradient id="rg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#48A8F0" stop-opacity=".35"/><stop offset="1" stop-color="#48A8F0" stop-opacity="0"/></linearGradient><linearGradient id="rl" x1="1" x2="0"><stop offset="0" stop-color="#48A8F0"/><stop offset="1" stop-color="#8053F8"/></linearGradient></defs>
        ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(232,235,244,.08)"/><text x="${W - 4}" y="${y(v) + 4}" font-size="11" fill="#7C87A6" text-anchor="end">${v}</text>`).join('')}
        <path d="${line} L${x(series.length - 1)},${H - pb} L${x(0)},${H - pb} Z" fill="url(#rg)"/>

function go(r, id) {

}

  if (S.pop === 'notif') {
    const n = inboxItems().slice(0, 3).map(it => [it.title, it.sub, it.conv?.id]);
    el.innerHTML = `<div class="pop" role="dialog" aria-label="الإشعارات"><h4>الإشعارات <button type="button" data-act="read-all">تعليم الكل كمقروء</button></h4>
      ${n.map(([t, s, id]) => `<button type="button" class="pop-item ${S.notifRead ? '' : 'unread'}" ${id ? `data-open="${id}"` : 'data-go="kb"'}><div style="min-width:0"><p>${esc(t)}</p><small>${esc(s)}</small></div></button>`).join('')}
      <button type="button" class="pop-item"><div><p style="font-weight:500">ملخص أمس جاهز: ${I().period.today.booked} ${I().bookedWord} و${I().period.today.after} خارج الدوام</p><small>أمس 11:00 م</small></div></button></div>`;
  } else if (S.pop === 'account') {
    el.innerHTML = `<div class="pop" role="menu" aria-label="الحساب" style="width:260px"><div style="padding:10px"><b>مدير المنشأة</b><div style="color:var(--dim);font-size:12px">${I().biz} · المالك</div></div>
      <button type="button" class="pop-item" data-go="settings">${ic('gear')}<p>الإعدادات</p></button>
      <button type="button" class="pop-item" data-go="agent">${ic('bot')}<p>إعدادات الموظف الذكي</p></button>
      <button type="button" class="pop-item" data-act="soon">${ic('question')}<p>الدعم والمساعدة</p></button>
      <button type="button" class="pop-item" data-act="soon" style="color:var(--bad)">${ic('back')}<p>تسجيل الخروج</p></button></div>`;
  } else el.innerHTML = '';
}

/* demo panel */
function renderDemo() {
  const el = $('#demo-panel');
  if (!S.demo) { el.innerHTML = ''; return; }
  const seg = (name, opts, cur) => `<div class="seg" role="group">${opts.map(([k, l]) => `<button type="button" aria-pressed="${cur === k}" data-demo="${name}" data-v="${k}">${l}</button>`).join('')}</div>`;
  el.innerHTML = `<div class="demo" role="dialog" aria-label="عرض تجريبي">
    <div style="display:flex;justify-content:space-between;align-items:center"><h4>عرض تجريبي</h4><button type="button" class="link" data-act="demo" aria-label="إغلاق">${ic('x')}</button></div>
    <p>جرّب كيف يتغير الداشبورد. البيانات أمثلة للتوضيح.</p>
    <div class="field"><label>القطاع</label>${seg('ind', [['clinic', 'عيادة'], ['real_estate', 'عقار'], ['ecommerce', 'متجر']], S.ind)}</div>
    <div class="field"><label>حالة الموظف الذكي</label>${seg('agent', [['live', 'يعمل'], ['paused', 'موقوف'], ['offline', 'مقطوع'], ['low', 'رصيد قليل']], S.agent)}</div>
    <div class="field"><label>الحساب</label>${seg('empty', [['0', 'فيه بيانات'], ['1', 'جديد فاضي']], S.empty ? '1' : '0')}</div>
    <button type="button" class="btn" data-act="reload">شوف حالة التحميل</button>
  </div>`;
}

/* modals */
function modal(html) { $('#layer').innerHTML = `<div class="scrim" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f = $('#layer').querySelector('input, textarea, button.pri'); f?.focus(); }
function closeModal() { $('#layer').innerHTML = ''; clearInterval(window.__sim); }
function teachModal(q, a) {
  const cats = I().kb.map(g => g.cat);
  modal(`<h3>${q && !a ? 'علّم الموظف الجواب' : a ? 'تعديل الجواب' : 'سؤال جديد'}</h3><p class="sub">اكتب الجواب مثل ما تقوله لعميل. ${I().agentName} بيستخدمه من المحادثة الجاية.</p>
    <form data-form="teach"><div class="field"><label for="t-q">السؤال</label><input class="input" id="t-q" value="${esc(q || '')}" required></div>
    <div class="field" style="margin-top:12px"><label for="t-a">الجواب</label><textarea class="textarea" id="t-a" required placeholder="مثال: إيه، عندنا جلسات تبييض بالليزر بـ 1500 ريال، والجلسة ساعة تقريبًا.">${esc(a || '')}</textarea></div>
    <div class="field" style="margin-top:12px"><label for="t-c">القسم</label><select class="select" id="t-c">${cats.map(c => `<option>${c}</option>`).join('')}</select></div>
    <div class="foot"><button type="button" class="btn" data-act="close-modal">إلغاء</button><button type="submit" class="btn pri">${ic('check')} احفظ الجواب</button></div></form>`);
}
function callModal(id) {
  const c = conv(id);
  modal(`<h3>اتصل بـ ${esc(c.name)}</h3><p class="sub">${esc(c.sum)}</p>
    <div style="display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--abyss);border:1px solid var(--line)"><span class="num" dir="ltr" style="font-size:22px;font-family:var(--f-display);flex:1;text-align:end;user-select:all">${c.phone}</span><button type="button" class="btn sm" data-act="copy" data-v="${c.phone}">${ic('copy')} نسخ</button></div>
    <div class="foot"><button type="button" class="btn" data-act="close-modal">إغلاق</button><button type="button" class="btn pri" data-act="called" data-id="${id}">${ic('check')} تم الاتصال</button></div>`);
}
function testModal() {
  const ind = I(); const c = ind.convos[0];
  modal(`<h3>${ind.voice ? 'مكالمة تجريبية' : 'محادثة تجريبية'} مع ${ind.agentName}</h3><p class="sub">هذي محاكاة لشكل الرد. في الداشبورد الحقيقي تسمع الصوت مباشرة.</p>
    <div class="thread" id="sim" style="min-height:180px"></div>
    <div class="foot"><button type="button" class="btn" data-act="close-modal">إنهاء</button></div>`);
  let i = 0; const box = $('#sim');
  window.__sim = setInterval(() => {
    if (!box.isConnected || i >= c.lines.length) { clearInterval(window.__sim); return; }
    const [w, t] = c.lines[i++]; box.insertAdjacentHTML('beforeend', `<div class="msg ${w}"><span class="who">${w === 'a' ? ind.agentName : 'أنت'}</span>${esc(t)}</div>`);
  }, 900);
}
function moreSheet() {
  modal(`<h3>المزيد</h3><div class="sheet" style="display:flex;flex-direction:column;gap:4px;margin-top:10px">${[['tickets', 'التذاكر', 'ticket'], ['customers', 'العملاء', 'users'], ['agent', 'إعدادات الموظف', 'bot'], ['reports', 'التقارير', 'chart'], ['settings', 'الإعدادات', 'gear']].map(([r, l, k]) => `<button type="button" class="nav" data-go="${r}">${ic(k)}${l}</button>`).join('')}</div>`);
}

/* ── events ── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-open],[data-act],[data-period],[data-filter],[data-tkfilter],[data-demo],[data-after]');
  if (!t) { if (S.pop && !e.target.closest('.pop')) { S.pop = null; renderPop(); } return; }
  if (t.dataset.go) { closeModal(); return go(t.dataset.go); }
  if (t.dataset.open) { closeModal(); return go('conv', t.dataset.open); }
  if (t.dataset.period) { S.period = t.dataset.period; return reload(); }
  if (t.dataset.filter) { S.filter = t.dataset.filter; return render(); }
  if (t.dataset.tkfilter) { S.tkFilter = t.dataset.tkfilter; return render(); }
  if (t.dataset.after) { S.settings.after = t.dataset.after; return render(); }
  if (t.dataset.demo) {
    const k = t.dataset.demo, v = t.dataset.v;
    if (k === 'ind') { S.ind = v; if (S.route === 'bookings' && !IND[v].bookings) S.route = 'home'; if (S.route === 'conv') S.route = 'convs'; S.settings.greeting = ''; S.filter = 'all'; }
    if (k === 'agent') S.agent = v;
    if (k === 'empty') S.empty = v === '1';
    return reload();
  }
  const a = t.dataset.act;
  if (a === 'close-modal') { if (e.target === t || t.tagName === 'BUTTON') closeModal(); return; }
  if (a === 'notif' || a === 'account') { S.pop = S.pop === a ? null : a; if (a === 'notif') {} return renderPop(); }
  if (a === 'read-all') { S.notifRead = true; S.pop = null; return render(); }
  if (a === 'demo') { S.demo = !S.demo; return renderDemo(); }
  if (a === 'reload') return reload();
  if (a === 'more') return moreSheet();
  if (a === 'teach') return teachModal(t.dataset.q, t.dataset.a);
  if (a === 'ticket') return ticketModal(t.dataset.id);
  if (a === 'new-ticket') return newTicketModal(t.dataset.conv);
  if (a === 'tstatus') {
    const tk = TK().find(x => x.id === t.dataset.id); tk.status = t.dataset.v;
    if (t.dataset.v === 'resolved') { tk.due = 'انحلت'; tk.late = false; }
    toast(t.dataset.v === 'resolved' ? 'تم حل التذكرة' : t.dataset.v === 'in_progress' ? 'بدأت معالجة التذكرة' : 'انفتحت التذكرة من جديد');
    render(); return ticketModal(tk.id);
  }
  if (a === 'call') return callModal(t.dataset.id);
  if (a === 'called') { S.dismissed.add(t.dataset.id); closeModal(); toast('تم. شلناها من قائمة المهام'); return render(); }
  if (a === 'dismiss') { S.dismissed.add(t.dataset.id); toast('تم وانشالت من القائمة'); return render(); }
  if (a === 'take') { S.taken.add(t.dataset.id); toast('المحادثة صارت عندك. الموظف الذكي وقف يرد عليها'); return render(); }
  if (a === 'release') { S.taken.delete(t.dataset.id); toast('رجعت للموظف الذكي'); return render(); }
  if (a === 'test-call') return testModal();
  if (a === 'agent-pause') { S.agent = 'paused'; toast('تم إيقاف الموظف الذكي مؤقتًا'); return render(); }
  if (a === 'agent-resume') { S.agent = 'live'; toast('الموظف الذكي رجع يرد'); return render(); }
  if (a === 'channel') { const k = t.dataset.k; S.settings.channels[k] = !S.settings.channels[k]; return render(); }
  if (a === 'day') { const r = S.settings.hours[+t.dataset.i]; r[1] = !r[1]; if (r[1] && !r[2]) { r[2] = '09:00'; r[3] = '17:00'; } return render(); }
  if (a === 'flip') { t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true')); return; }
  if (a === 'play') { S.playing = !S.playing; return render(); }
  if (a === 'save') { const g = $('#ag-greet'); if (g) S.settings.greeting = g.value; return toast('تم الحفظ'); }
  if (a === 'copy') { const v = t.dataset.v; navigator.clipboard?.writeText(v).then(() => toast('انسخ الرقم'), () => toast('حدد الرقم وانسخه يدويًا')); return; }
  if (a === 'soon') return toast('هذا الجزء جاهز في التصميم، ويُربط عند التطبيق');
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'teach') {
    const q = $('#t-q').value.trim(), ans = $('#t-a').value.trim();
    if (!q || !ans) return;
    S.answered.add(S.ind + q); S.kbAdded.unshift({ ind: S.ind, q, a: ans });
    closeModal(); toast(`انضاف لقاعدة المعرفة. ${I().agentName} بيجاوبه من المحادثة الجاية`); render();
  }
  if (f.dataset.form === 'ticket') {
    const id = 'T-' + (++S.tkSeq);
    TK().unshift({ id, subject: $('#nt-s').value.trim(), type: $('#nt-t').value, pri: $('#nt-p').value, status: 'open', conv: f.dataset.conv || '', customer: $('#nt-c').value.trim(), who: $('#nt-w').value, due: 'خلال 4 س', late: false, created: 'الحين', src: 'staff' });
    closeModal(); toast(`انفتحت التذكرة ${id}`); return render();
  }
  if (f.dataset.form === 'tnote') {
    const v = $('#tk-note').value.trim(); if (!v) return;
    (S.tkNotes[f.dataset.id] = S.tkNotes[f.dataset.id] || []).push(v); return ticketModal(f.dataset.id);
  }
  if (f.dataset.form === 'reply') {
    const id = f.dataset.id, inp = $('#reply-' + id), v = inp.value.trim(); if (!v) return;
    (S.staffMsgs[id] = S.staffMsgs[id] || []).push(v); render(); $('#reply-' + id)?.focus();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'tk-who') {
    const tk = TK().find(x => x.id === e.target.dataset.tk); tk.who = e.target.value;
    toast(tk.who ? `تم تعيينها لـ ${tk.who}` : 'شلنا المسؤول'); render(); ticketModal(tk.id);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'conv-search') { S.search = e.target.value.trim(); const pos = e.target.selectionStart; render(); const el = $('#conv-search'); el.focus(); el.setSelectionRange(pos, pos); }
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { S.search = e.target.value.trim(); S.filter = 'all'; go('convs'); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); S.pop = null; renderPop(); }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
});

render();
</script>

</body>
</html>
