<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; background: #0b1224; color: #e6eeff; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    label { display: block; font-size: 12px; color: #9fb2d8; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px; border: 1px solid #2a3a63; background: #121c38; color: #fff; direction: ltr; }
    button { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 8px; background: #2f6bff; color: #fff; font-weight: 700; cursor: pointer; }
    button.alt { background: #1b2748; }
    #state { margin-top: 12px; font-size: 12.5px; line-height: 1.7; color: #b6c6e6; white-space: pre-line; }
  </style>
</head>
<body>
  <h1>مدار — مساعد واتساب</h1>
  <label for="token">رمز الجهاز (من لوحة مدار ← الإيجنت AI ← واتساب)</label>
  <input id="token" placeholder="mwa_..." autocomplete="off" />
  <button id="save">حفظ الرمز</button>
  <button id="toggle" class="alt">إيقاف مؤقت</button>
  <button id="open" class="alt">افتح واتساب ويب</button>
  <label for="me">تجربة بدون خادم: رقمك (مثل 9665XXXXXXXX)</label>
  <input id="me" placeholder="9665XXXXXXXX" />
  <button id="test" class="alt">أرسل رسالة تجربة لنفسي</button>
  <button id="self" class="alt">افحص واتساب ويب</button>
  <div id="state">…</div>
  <script src="popup.js"></script>
</body>
</html>
